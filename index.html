<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Player</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#111;color:#eee}
  header{padding:12px 16px;background:#1a1a1a;position:sticky;top:0;z-index:10;
         display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #2a2a2a}
  header h1{font-size:16px;margin:0;white-space:nowrap}
  input,select,button{padding:8px;border-radius:6px;border:1px solid #444;
                      background:#222;color:#eee;font-size:13px;font-family:inherit}
  button{cursor:pointer}
  button:hover{background:#2e2e2e}
  button:disabled{opacity:.3;cursor:not-allowed}
  #count{font-size:12px;color:#888;white-space:nowrap}
  #showFavorites.active{border-color:#ffbd4a;color:#ffcf70;background:#382b16}
  #togglePlaylist{display:none}
  #loadMoreWrap{grid-column:1/-1;text-align:center;padding:12px}
  .card .thumb{position:relative}
  .favorite-btn{position:absolute;top:8px;right:8px;z-index:1;width:34px;height:34px;padding:0;
                border-radius:50%;background:#000b;border:1px solid #fff5;color:#fff;font-size:19px;line-height:1}
  .favorite-btn.is-favorite{color:#ffca55;border-color:#ffca55}
  .favorite-btn:hover{background:#30250f}
  .favorite-action{position:static;width:auto;height:auto;padding:6px 9px;border-radius:6px;
                   font-size:12px;line-height:1.2;white-space:nowrap}

  #layout{display:grid;grid-template-columns:1fr 300px;height:calc(100vh - 60px)}
  @media(max-width:900px){#layout{grid-template-columns:1fr;height:auto}#playlist{display:none}#togglePlaylist{display:inline-block}#playlist.mobile-open{display:block;position:fixed;z-index:20;inset:0 0 0 auto;width:min(85vw,320px);box-shadow:-8px 0 24px #0009}}

  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
        gap:10px;padding:14px;overflow-y:auto}
  .card{background:#1c1c1c;border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s}
  .card:hover{transform:scale(1.03)}
  .card .thumb{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;
               font-size:28px;background:linear-gradient(135deg,#2a2a2a,#3a3a3a);color:#555}
  .card .thumb img{width:100%;height:100%;object-fit:cover}
  .card .info{padding:8px;font-size:12px}
  .card .meta{color:#999;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{display:inline-block;background:#333;padding:2px 6px;border-radius:4px;font-size:10px;margin-right:4px}
  .badge.src-so{background:#3b2f4a;color:#c9a7ff}
  .badge.src-rw{background:#2f3f4a;color:#a7d1ff}
  .badge.src-cx{background:#3f4533;color:#d5e8a2}
  .card.playing{outline:3px solid #4ea1ff}

  #playlist{background:#161616;border-left:1px solid #2a2a2a;overflow-y:auto;padding:10px}
  #playlist h3{font-size:13px;margin:6px 4px;color:#aaa}
  .pl-item{display:flex;gap:8px;padding:6px;border-radius:6px;cursor:pointer;font-size:11px;align-items:center;color:#bbb}
  .pl-item:hover{background:#222}
  .pl-item.active{background:#1e3a5f;color:#fff}
  .pl-item .num{color:#666;min-width:28px}
  .loading{padding:40px;text-align:center;color:#888;grid-column:1/-1;line-height:1.7}

  /* ===== Player: ทั้ง modal เป็นเต็มจอ ปุ่มลอยทับวิดีโอ ===== */
  #modal{display:none;position:fixed;inset:0;background:#000;z-index:100}
  #modal.active{display:block}
  #stage{position:absolute;inset:0;background:#000}
  #player{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  #ui{position:absolute;inset:0;pointer-events:none;transition:opacity .25s}
  #ui.hide{opacity:0}
  #ui button,#ui label,#ui a{pointer-events:auto}
  #ui.hide button,#ui.hide label,#ui.hide a{pointer-events:none}
  .topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
          align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 28px;
          background:linear-gradient(#000c,transparent);font-size:13px}
  .round{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;
         border-radius:50%;font-size:22px;background:#000a;border:1px solid #fff4;color:#fff}
  #btnPrev{left:12px} #btnNext{right:12px}
  .bottombar{position:absolute;left:0;right:0;bottom:60px;padding:24px 14px 8px;display:flex;
             gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:12px;
             color:#ccc;background:linear-gradient(transparent,#000b)}
  .bottombar a{color:#4ea1ff}
  .autonext{display:flex;align-items:center;gap:6px}
  .autonext input{width:auto}
  .quality-control{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .quality-control select{max-width:132px;padding:6px}
  #errorBox{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
            width:min(92%,520px);background:#4a2020;color:#ffaaaa;padding:14px;border-radius:8px;
            font-size:13px;line-height:1.6;z-index:5}
  #errorBox.active{display:block}
  #bufferStatus{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
                z-index:4;max-width:85%;padding:10px 14px;border:1px solid #ffffff26;border-radius:8px;
                background:#000b;color:#eee;text-align:center;font-size:13px;pointer-events:none}
  #bufferStatus.active{display:block}
  #errorBox button{margin-top:10px;background:#6a2a2a;border-color:#8a3a3a}
</style>
</head>
<body>

<header>
  <h1>🎬 Video Player</h1>
  <select id="source">
    <option value="all">ทุกแหล่ง</option>
    <option value="SoMay">@So_MayBDSM</option>
    <option value="Rewaida">@RewaidaMohamed</option>
    <option value="Rabbit Rayong">@CxllmeB64 · Rabbit Rayong</option>
  </select>
  <input id="search" type="search" placeholder="ค้นหา..." style="flex:1;min-width:150px">
  <select id="sort">
    <option value="date">เรียงตามวันที่</option>
    <option value="views">เรียงตามยอดวิว</option>
    <option value="duration">เรียงตามความยาว</option>
  </select>
  <button id="showFavorites" type="button" aria-pressed="false">☆ รายการโปรด 0</button>
  <button id="togglePlaylist" type="button" aria-expanded="false">Playlist</button>
  <span id="count"></span>
</header>

<div id="layout">
  <div id="grid"><div class="loading">กำลังโหลดข้อมูล...</div></div>
  <aside id="playlist">
    <h3>Playlist</h3>
    <div id="plList"></div>
  </aside>
</div>

<div id="modal">
  <div id="stage">
    <video id="player" controls controlslist="nofullscreen" playsinline
           preload="metadata" referrerpolicy="no-referrer"></video>

    <div id="bufferStatus" role="status" aria-live="polite"></div>
    <div id="ui">
      <div class="topbar">
        <button id="btnClose">✕ ปิด</button>
        <span id="pos">- / -</span>
        <button id="btnFS">⛶ เต็มจอ</button>
      </div>
      <button class="round" id="btnPrev">◀</button>
      <button class="round" id="btnNext">▶</button>
      <div class="bottombar">
        <label class="autonext"><input type="checkbox" id="autonext" checked> เล่นต่ออัตโนมัติ</label>
        <label class="autonext"><input type="checkbox" id="autofs" checked> เปิดเต็มจอทันที</label>
        <label class="quality-control">คุณภาพ <select id="qualityMode" aria-label="คุณภาพวิดีโอ">
          <option value="auto">อัตโนมัติ</option>
          <option value="original">ต้นฉบับ</option>
          <option value="max">สูงสุด</option>
        </select></label>
        <span id="details"></span>
      </div>
    </div>

    <div id="errorBox">
      <strong>⚠️ เล่นวิดีโอไม่ได้</strong><br>
      <span id="errInfo"></span><br>
      <button id="btnRetry">🔄 ลองอีกครั้ง</button>
      <button id="btnSkip">ข้ามไปคลิปถัดไป ▶</button>
      <button id="btnOpenVideo">เปิด MP4 ตรงๆ ↗</button>
    </div>
  </div>
</div>

<script type="module" src="./src/app.js"></script>
</body>
</html>
