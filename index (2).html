<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Player — 1642 วิดีโอ</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#111;color:#eee}
  header{padding:12px 16px;background:#1a1a1a;position:sticky;top:0;z-index:10;
         display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #2a2a2a}
  header h1{font-size:16px;margin:0;white-space:nowrap}
  input,select,button{padding:8px;border-radius:6px;border:1px solid #444;
                      background:#222;color:#eee;font-size:13px;font-family:inherit}
  button{cursor:pointer}
  button:hover{background:#2e2e2e}
  button:disabled{opacity:.3;cursor:not-allowed}
  #count{font-size:12px;color:#888;white-space:nowrap}

  #layout{display:grid;grid-template-columns:1fr 300px;height:calc(100vh - 60px)}
  @media(max-width:900px){#layout{grid-template-columns:1fr;height:auto}#playlist{display:none}}

  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
        gap:10px;padding:14px;overflow-y:auto}
  .card{background:#1c1c1c;border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s}
  .card:hover{transform:scale(1.03)}
  .card .thumb{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;
               font-size:28px;background:linear-gradient(135deg,#2a2a2a,#3a3a3a);color:#555}
  .card .thumb img{width:100%;height:100%;object-fit:cover}
  .card .info{padding:8px;font-size:12px}
  .card .meta{color:#999;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{display:inline-block;background:#333;padding:2px 6px;border-radius:4px;font-size:10px;margin-right:4px}
  .badge.src-so{background:#3b2f4a;color:#c9a7ff}
  .badge.src-rw{background:#2f3f4a;color:#a7d1ff}
  .card.playing{outline:3px solid #4ea1ff}

  #playlist{background:#161616;border-left:1px solid #2a2a2a;overflow-y:auto;padding:10px}
  #playlist h3{font-size:13px;margin:6px 4px;color:#aaa}
  .pl-item{display:flex;gap:8px;padding:6px;border-radius:6px;cursor:pointer;font-size:11px;align-items:center;color:#bbb}
  .pl-item:hover{background:#222}
  .pl-item.active{background:#1e3a5f;color:#fff}
  .pl-item .num{color:#666;min-width:28px}
  .loading{padding:40px;text-align:center;color:#888;grid-column:1/-1;line-height:1.7}

  /* ===== Player: ทั้ง modal เป็นเต็มจอ ปุ่มลอยทับวิดีโอ ===== */
  #modal{display:none;position:fixed;inset:0;background:#000;z-index:100}
  #modal.active{display:block}
  #stage{position:absolute;inset:0;background:#000}
  #player{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  #ui{position:absolute;inset:0;pointer-events:none;transition:opacity .25s}
  #ui.hide{opacity:0}
  #ui button,#ui label,#ui a{pointer-events:auto}
  #ui.hide button,#ui.hide label,#ui.hide a{pointer-events:none}
  .topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
          align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 28px;
          background:linear-gradient(#000c,transparent);font-size:13px}
  .round{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;
         border-radius:50%;font-size:22px;background:#000a;border:1px solid #fff4;color:#fff}
  #btnPrev{left:12px} #btnNext{right:12px}
  .bottombar{position:absolute;left:0;right:0;bottom:60px;padding:24px 14px 8px;display:flex;
             gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:12px;
             color:#ccc;background:linear-gradient(transparent,#000b)}
  .bottombar a{color:#4ea1ff}
  .autonext{display:flex;align-items:center;gap:6px}
  .autonext input{width:auto}
  #errorBox{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
            width:min(92%,520px);background:#4a2020;color:#ffaaaa;padding:14px;border-radius:8px;
            font-size:13px;line-height:1.6;z-index:5}
  #errorBox.active{display:block}
  #errorBox button{margin-top:10px;background:#6a2a2a;border-color:#8a3a3a}
</style>

<body>

<header>
  <h1>🎬 Video Player</h1>
  <select id="source">
    <option value="all">ทุกแหล่ง</option>
    <option value="SoMay">@So_MayBDSM</option>
    <option value="Rewaida">@RewaidaMohamed</option>
  </select>
  <input id="search" type="search" placeholder="ค้นหา..." style="flex:1;min-width:150px">
  <select id="sort">
    <option value="date">เรียงตามวันที่</option>
    <option value="views">เรียงตามยอดวิว</option>
    <option value="duration">เรียงตามความยาว</option>
  </select>
  <span id="count"></span>
</header>

<div id="layout">
  <div id="grid"><div class="loading">กำลังโหลดข้อมูล...</div></div>
  <aside id="playlist">
    <h3>Playlist</h3>
    <div id="plList"></div>
  </aside>
</div>

<div id="modal">
  <div id="stage">
    <video id="player" controls controlslist="nofullscreen" playsinline
           preload="metadata" referrerpolicy="no-referrer"></video>

    <div id="ui">
      <div class="topbar">
        <button onclick="closeModal()">✕ ปิด</button>
        <span id="pos">- / -</span>
        <button id="btnFS" onclick="toggleFS()">⛶ เต็มจอ</button>
      </div>
      <button class="round" id="btnPrev">◀</button>
      <button class="round" id="btnNext">▶</button>
      <div class="bottombar">
        <label class="autonext"><input type="checkbox" id="autonext" checked> เล่นต่ออัตโนมัติ</label>
        <label class="autonext"><input type="checkbox" id="autofs" checked> เปิดเต็มจอทันที</label>
        <label class="autonext"><input type="checkbox" id="hqOn" checked> ภาพคมสุด</label>
        <span id="details"></span>
      </div>
    </div>

    <div id="errorBox">
      <strong>⚠️ เล่นวิดีโอไม่ได้</strong><br>
      <span id="errInfo"></span><br>
      <button onclick="retryCurrent()">🔄 ลองอีกครั้ง</button>
      <button onclick="nextVideo()">ข้ามไปคลิปถัดไป ▶</button>
      <button onclick="window.open(currentList[currentIdx].video_url_mp4,'_blank')">เปิด MP4 ตรงๆ ↗</button>
    </div>
  </div>
</div>

/* ---------- แปลงข้อมูล ---------- */
function parseRawData(raw){
  return raw.trim().split('\n').map(line=>{
    const p = line.split('|');
    if(p.length < 8) return null;
    const [src, date, post, mp4, thumb, dur, views, ...rest] = p;
    if(!mp4.startsWith('http')) return null;
    return {
      _source: src === 'SO' ? 'SoMay' : 'Rewaida',
      _sourceLabel: src === 'SO' ? 'So_May' : 'Rewaida',
      posted_utc: date, post_url: post, video_url_mp4: mp4,
      thumbnail: thumb || '', duration_sec: dur, views: views,
      text: rest.join('|')
    };
  }).filter(Boolean);
}

/* ---------- State & DOM ---------- */
let DATA = [], currentList = [], currentIdx = -1, openToken = 0;
const $ = id => document.getElementById(id);
const grid=$('grid'), plList=$('plList'), countEl=$('count');
const searchEl=$('search'), sortEl=$('sort'), sourceEl=$('source');
const modal=$('modal'), stage=$('stage'), ui=$('ui'), player=$('player');
const detailsEl=$('details'), posEl=$('pos'), btnPrev=$('btnPrev'), btnNext=$('btnNext');
const btnFS=$('btnFS'), autonextEl=$('autonext'), autofsEl=$('autofs'), hqOn=$('hqOn'), errorBox=$('errorBox');

/* ---------- Helpers ---------- */
function fmtDur(s){s=+s||0;return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function esc(s){return (s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function fmtViews(n){n=+n||0;if(n>=1e6)return (n/1e6).toFixed(1)+'M';if(n>=1e3)return (n/1e3).toFixed(1)+'K';return n;}
function buildVideoUrl(u){return !u?'':(PROXY_PREFIX?PROXY_PREFIX+encodeURIComponent(u):u);}

/* ---------- หาลิงก์ความละเอียดสูงสุด (ต้องตั้ง PROXY_PREFIX ก่อน) ---------- */
const HQ_BASE = PROXY_PREFIX ? PROXY_PREFIX.split('?')[0] : '';
const hqCache = new Map();   // post_url -> Promise<{url,width,height}|null>
function resolveHQ(d){
  if(!HQ_BASE) return Promise.resolve(null);
  if(hqCache.has(d.post_url)) return hqCache.get(d.post_url);
  const id = (d.post_url.match(/status\/(\d+)/)||[])[1];
  const mid = (d.video_url_mp4.match(/(?:amplify_video|ext_tw_video)\/(\d+)\//)||[])[1] || '';
  const p = !id ? Promise.resolve(null) :
    fetch(`${HQ_BASE}?hq=${id}&m=${mid}`).then(r=>r.json()).then(j=>j.url?j:null).catch(()=>null);
  hqCache.set(d.post_url, p);
  return p;
}
const withTimeout=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
function pixels(u){const m=/\/(\d+)x(\d+)\//.exec(u||'');return m?+m[1]*+m[2]:0;}

/* ---------- รายการ / แสดงผล ---------- */
function buildList(){
  const q = searchEl.value.toLowerCase(), src = sourceEl.value, k = sortEl.value;
  const list = DATA.filter(d=>{
    if(src!=='all' && d._source!==src) return false;
    if(!q) return true;
    return (d.text||'').toLowerCase().includes(q) || d.posted_utc.includes(q);
  });
  list.sort((a,b)=>{
    if(k==='views')    return (+b.views)-(+a.views);
    if(k==='duration') return (+b.duration_sec)-(+a.duration_sec);
    return new Date(b.posted_utc.replace(' ','T'))-new Date(a.posted_utc.replace(' ','T'));
  });
  return list;
}

function render(){
  currentList = buildList();
  countEl.textContent = `${currentList.length} วิดีโอ`;
  if(!currentList.length){
    grid.innerHTML = '<div class="loading">ไม่พบวิดีโอ</div>';
    plList.innerHTML = '';
    return;
  }
  const MAX_CARDS = 300;
  grid.innerHTML = currentList.slice(0, MAX_CARDS).map((d,i)=>{
    const thumb = d.thumbnail
      ? `<img src="${d.thumbnail}" loading="lazy" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'">`
      : '🎬';
    const cls = d._source==='SoMay' ? 'src-so' : 'src-rw';
    return `<div class="card ${i===currentIdx?'playing':''}" data-i="${i}">
      <div class="thumb">${thumb}</div>
      <div class="info">
        <div><span class="badge ${cls}">${d._sourceLabel}</span>
          <span class="badge">👁 ${fmtViews(d.views)}</span>
          <span class="badge">⏱ ${fmtDur(d.duration_sec)}</span></div>
        <div class="meta">${d.posted_utc}</div>
      </div></div>`;
  }).join('');
  if(currentList.length > MAX_CARDS){
    grid.innerHTML += `<div class="loading">แสดง ${MAX_CARDS} จาก ${currentList.length} — ใช้ค้นหา/ตัวกรองเพื่อดูเพิ่ม</div>`;
  }
  grid.querySelectorAll('.card').forEach(el=>{ el.onclick=()=>openAt(+el.dataset.i,true); });
  renderPlaylist();
}

function renderPlaylist(){
  plList.innerHTML = currentList.slice(0,200).map((d,i)=>`
    <div class="pl-item ${i===currentIdx?'active':''}" data-i="${i}">
      <span class="num">${i+1}.</span>
      <span>${fmtDur(d.duration_sec)} · 👁${fmtViews(d.views)} · ${d._sourceLabel}</span>
    </div>`).join('');
  plList.querySelectorAll('.pl-item').forEach(el=>{ el.onclick=()=>openAt(+el.dataset.i,true); });
}

function updateActive(){
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('playing',+c.dataset.i===currentIdx));
  document.querySelectorAll('.pl-item').forEach(c=>{
    const a=+c.dataset.i===currentIdx; c.classList.toggle('active',a);
    if(a) c.scrollIntoView({block:'nearest'});
  });
}

/* ---------- เต็มจอ (ทั้ง modal ไม่ใช่แค่ตัววิดีโอ) ---------- */
const fsEl = ()=>document.fullscreenElement||document.webkitFullscreenElement;
function enterFS(){
  const f = modal.requestFullscreen||modal.webkitRequestFullscreen;
  if(f){try{const r=f.call(modal);r&&r.catch&&r.catch(()=>{});}catch(e){}}
}
function exitFS(){
  const f = document.exitFullscreen||document.webkitExitFullscreen;
  if(f&&fsEl()){try{const r=f.call(document);r&&r.catch&&r.catch(()=>{});}catch(e){}}
}
function toggleFS(){ fsEl()?exitFS():enterFS(); }
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>
  document.addEventListener(ev,()=>{
    btnFS.textContent = fsEl()?'⤢ ออกเต็มจอ':'⛶ เต็มจอ';
    showUI();
  }));

/* ---------- ซ่อน/แสดงปุ่มอัตโนมัติ ---------- */
let uiTimer;
function showUI(){
  ui.classList.remove('hide');
  clearTimeout(uiTimer);
  uiTimer = setTimeout(()=>{ if(!player.paused) ui.classList.add('hide'); },3000);
}
['mousemove','touchstart','click'].forEach(ev=>stage.addEventListener(ev,showUI,{passive:true}));
player.addEventListener('play',showUI);
player.addEventListener('pause',showUI);

/* ---------- Player ---------- */
function openAt(i,fromUser){
  if(i<0||i>=currentList.length) return;
  if(fromUser && autofsEl.checked && !fsEl()) enterFS();  // ต้องเรียกตอนผู้ใช้กดเท่านั้น
  currentIdx = i;
  const d = currentList[i];
  errorBox.classList.remove('active');
  const token = ++openToken;
  d._usingHQ = false; d._res = '';
  const startPlay = url=>{
    if(token!==openToken) return;
    player.src = buildVideoUrl(url);
    player.load();
    player.play().catch(err=>console.log('autoplay blocked:',err.message));
    const nx=currentList[i+1]; if(nx && hqOn.checked) resolveHQ(nx);   // โหลดล่วงหน้าคลิปถัดไป
  };
  if(hqOn.checked && HQ_BASE && !d._hqFailed){
    withTimeout(resolveHQ(d),4000).then(h=>{
      if(h && pixels(h.url) > pixels(d.video_url_mp4)){
        d._usingHQ = true; d._res = h.height+'p'; updateDetails(d);
        startPlay(h.url);
      } else startPlay(d.video_url_mp4);
    });
  } else startPlay(d.video_url_mp4);

  posEl.textContent = `${i+1} / ${currentList.length}`;
  btnPrev.disabled = (i<=0);
  btnNext.disabled = (i>=currentList.length-1);
  updateDetails(d);
  modal.classList.add('active');
  updateActive();
  showUI();
}
function updateDetails(d){
  detailsEl.innerHTML = `${d._sourceLabel}${d.text?' · '+esc(d.text):''} · 👁 ${d.views} · ⏱ ${fmtDur(d.duration_sec)}`
    + (d._res?` · 🔆 ${d._res}`:'')
    + ` · <a href="${d.post_url}" target="_blank" rel="noopener">ทวีต ↗</a>`;
}
function retryCurrent(){ if(currentIdx>=0) openAt(currentIdx); }
function nextVideo(){ if(currentIdx<currentList.length-1) openAt(currentIdx+1); }
function prevVideo(){ if(currentIdx>0) openAt(currentIdx-1); }

function closeModal(){
  exitFS();
  modal.classList.remove('active');
  player.pause(); player.removeAttribute('src'); player.load();
  errorBox.classList.remove('active');
  currentIdx = -1;
  render();
}

player.addEventListener('error',()=>{
  const cur = currentList[currentIdx];
  if(cur && cur._usingHQ){           // ลิงก์คมสุดเล่นไม่ได้ -> กลับไปใช้ลิงก์เดิม
    cur._usingHQ=false; cur._hqFailed=true; cur._res='';  updateDetails(cur);
    player.src = buildVideoUrl(cur.video_url_mp4); player.load(); player.play().catch(()=>{});
    return;
  }
  const c = player.error ? player.error.code : '?';
  const names = {1:'ถูกยกเลิก',2:'เครือข่าย/ถูกบล็อก (มักเป็น 403)',3:'ถอดรหัสไฟล์ไม่ได้',4:'ไม่พบไฟล์หรือเบราว์เซอร์ไม่รองรับ'};
  $('errInfo').textContent = `รหัสข้อผิดพลาด ${c}: ${names[c]||'ไม่ทราบสาเหตุ'}`
    + (PROXY_PREFIX ? ' (ผ่าน proxy แล้ว)' : ' — ถ้ากด "เปิด MP4 ตรงๆ" แล้วเล่นได้ แปลว่าเว็บนี้ถูกบล็อก ต้องใช้ proxy');
  console.error('video error', player.error, player.src);
  errorBox.classList.add('active');
});
player.addEventListener('ended',()=>{ if(autonextEl.checked) nextVideo(); });
player.addEventListener('loadeddata',()=>errorBox.classList.remove('active'));

/* ---------- ปุ่มและตัวกรอง ---------- */
btnPrev.onclick = prevVideo;
btnNext.onclick = nextVideo;
searchEl.oninput = ()=>{currentIdx=-1;render();};
sortEl.onchange  = ()=>{currentIdx=-1;render();};
sourceEl.onchange= ()=>{currentIdx=-1;render();};

/* มือถือ: ปัดขึ้น = ถัดไป, ปัดลง = ก่อนหน้า (ไม่นับแถบควบคุมวิดีโอด้านล่าง) */
let tx=0,ty=0,tOK=false;
stage.addEventListener('touchstart',e=>{
  const t=e.touches[0]; tx=t.clientX; ty=t.clientY; tOK = ty < innerHeight-90;
},{passive:true});
stage.addEventListener('touchend',e=>{
  if(!tOK) return;
  const t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty;
  if(Math.abs(dy)>80 && Math.abs(dx)<60) (dy<0?nextVideo():prevVideo());
},{passive:true});

/* คีย์บอร์ด */
document.addEventListener('keydown',e=>{
  if(!modal.classList.contains('active')) return;
  if(e.key==='Escape' && !fsEl()) closeModal();
  else if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();nextVideo();}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();prevVideo();}
  else if(e.key==='f'||e.key==='F') toggleFS();
  else if(e.key===' '){e.preventDefault();player.paused?player.play():player.pause();}
});

/* ---------- เริ่มต้น ---------- */
(function init(){
  try{
    DATA = parseRawData(RAW_DATA);
    console.log(`✓ โหลด ${DATA.length} วิดีโอ`);
    if(!DATA.length){
      grid.innerHTML = '<div class="loading">ยังไม่มีข้อมูลวิดีโอ<br>ข้อมูลใน RAW_DATA ว่างเปล่า</div>';
      return;
    }
    render();
  }catch(e){
    console.error(e);
    grid.innerHTML = `<div class="loading">❌ เกิดข้อผิดพลาด: ${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
